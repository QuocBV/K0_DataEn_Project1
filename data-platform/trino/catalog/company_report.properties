# Trino catalog for company-report S3 bucket (reporting layer)
connector.name=iceberg
iceberg.catalog.type=HIVE_METASTORE
hive.metastore.uri=thrift://hive-metastore:9083

# S3 credentials
hive.s3.aws-access-key=${ENV:AWS_ACCESS_KEY_ID}
hive.s3.aws-secret-key=${ENV:AWS_SECRET_ACCESS_KEY}
hive.s3.endpoint=${ENV:AWS_S3_ENDPOINT:s3.amazonaws.com}
hive.s3.path-style-access=true
hive.s3.region=${ENV:AWS_REGION:ap-southeast-1}

# Iceberg
iceberg.file-format=PARQUET
iceberg.compression-codec=ZSTD
iceberg.expire_snapshots_min_retention=365d