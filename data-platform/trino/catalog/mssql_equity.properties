# Trino catalog connecting to MSSQL localhost - SSI_Equity database
connector.name=sqlserver
connection-url=jdbc:sqlserver://host.docker.internal:1433;databaseName=SSI_Equity;encrypt=false;trustServerCertificate=true
connection-user=${ENV:MSSQL_EXPORT_USER}
connection-password=${ENV:MSSQL_EXPORT_PASSWORD}