# Octavia CLI connection config - HR API (static/mock) -> RAW.HR. Small volume (employee roster),
# full refresh is simplest and cheapest.
definition_type: connection
resource_name: "hr_api_to_snowflake"
source_configuration_path: "sources/hr_api.yaml"
destination_configuration_path: "destinations/snowflake_raw.yaml"
configuration:
  schedule_type: manual
  destination_namespace: "HR"  # lands in RAW.HR
  namespace_definition: "custom_format"
  sync_catalog:
    streams:
      - stream:
          name: "employees"
          json_schema: {}
          supported_sync_modes: ["full_refresh"]
        config:
          sync_mode: "full_refresh"
          destination_sync_mode: "overwrite"
