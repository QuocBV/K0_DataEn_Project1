# Octavia CLI connection config. Only dimension tables sync through Airbyte/JDBC here -
# derivative_trade, account_balance_daily, position_daily and margin_loan_daily load via the
# file-based bulk path instead (see snowflake/03_bulk_load_derivatives.sql).
definition_type: connection
resource_name: "mssql_derivatives_to_snowflake"
source_configuration_path: "sources/mssql_derivatives.yaml"
destination_configuration_path: "destinations/snowflake_raw.yaml"
configuration:
  schedule_type: manual
  destination_namespace: "DERIVATIVES"  # lands in RAW.DERIVATIVES
  namespace_definition: "custom_format"
  sync_catalog:
    streams:
      - stream:
          name: "derivative_contract"
          json_schema: {}
          supported_sync_modes: ["full_refresh"]
        config:
          sync_mode: "full_refresh"
          destination_sync_mode: "overwrite"
      - stream:
          name: "daily_settlement_price"
          json_schema: {}
          supported_sync_modes: ["full_refresh", "incremental"]
          default_cursor_field: ["price_date"]
        config:
          sync_mode: "incremental"
          destination_sync_mode: "append_dedup"
          cursor_field: ["price_date"]
          primary_key: [["contract_id"], ["price_date"]]
      - stream:
          name: "account"
          json_schema: {}
          supported_sync_modes: ["full_refresh"]
        config:
          sync_mode: "full_refresh"
          destination_sync_mode: "overwrite"
      # derivative_trade / account_balance_daily / position_daily / margin_loan_daily: deliberately
      # NOT listed here - loaded via Parquet export + Snowpipe/COPY INTO instead.
