# Octavia CLI connection config. schedule_type is manual because Airflow triggers this sync
# explicitly (AirbyteTriggerSyncOperator) as part of the ingest DAG - see airflow/dags/.
definition_type: connection
resource_name: "mssql_common_to_snowflake"
source_configuration_path: "sources/mssql_common.yaml"
destination_configuration_path: "destinations/snowflake_raw.yaml"
configuration:
  schedule_type: manual
  destination_namespace: "COMMON"  # lands in RAW.COMMON
  namespace_definition: "custom_format"
  sync_catalog:
    streams:
      # Dimension-like tables: small volume, full refresh + overwrite is simplest and cheapest.
      - stream:
          name: "branch"
          json_schema: {}
          supported_sync_modes: ["full_refresh"]
        config:
          sync_mode: "full_refresh"
          destination_sync_mode: "overwrite"
      - stream:
          name: "department"
          json_schema: {}
          supported_sync_modes: ["full_refresh"]
        config:
          sync_mode: "full_refresh"
          destination_sync_mode: "overwrite"
      - stream:
          name: "broker"
          json_schema: {}
          supported_sync_modes: ["full_refresh"]
        config:
          sync_mode: "full_refresh"
          destination_sync_mode: "overwrite"
      - stream:
          name: "customer"
          json_schema: {}
          supported_sync_modes: ["full_refresh"]
        config:
          sync_mode: "full_refresh"
          destination_sync_mode: "overwrite"
      # History/event tables: append-only, incremental on ingested_at so re-syncs don't reprocess everything.
      - stream:
          name: "customer_broker_history"
          json_schema: {}
          supported_sync_modes: ["full_refresh", "incremental"]
          source_defined_cursor: false
          default_cursor_field: ["ingested_at"]
        config:
          sync_mode: "incremental"
          destination_sync_mode: "append"
          cursor_field: ["ingested_at"]
      - stream:
          name: "customer_risk_profile"
          json_schema: {}
          supported_sync_modes: ["full_refresh", "incremental"]
          default_cursor_field: ["ingested_at"]
        config:
          sync_mode: "incremental"
          destination_sync_mode: "append"
          cursor_field: ["ingested_at"]
      - stream:
          name: "customer_segment_history"
          json_schema: {}
          supported_sync_modes: ["full_refresh", "incremental"]
          default_cursor_field: ["ingested_at"]
        config:
          sync_mode: "incremental"
          destination_sync_mode: "append"
          cursor_field: ["ingested_at"]
      - stream:
          name: "customer_acquisition"
          json_schema: {}
          supported_sync_modes: ["full_refresh"]
        config:
          sync_mode: "full_refresh"
          destination_sync_mode: "overwrite"
      - stream:
          name: "fee_schedule"
          json_schema: {}
          supported_sync_modes: ["full_refresh"]
        config:
          sync_mode: "full_refresh"
          destination_sync_mode: "overwrite"
      - stream:
          name: "management_commission_schedule"
          json_schema: {}
          supported_sync_modes: ["full_refresh"]
        config:
          sync_mode: "full_refresh"
          destination_sync_mode: "overwrite"
      - stream:
          name: "market_index_price"
          json_schema: {}
          supported_sync_modes: ["full_refresh", "incremental"]
          default_cursor_field: ["price_date"]
        config:
          sync_mode: "incremental"
          destination_sync_mode: "append_dedup"
          cursor_field: ["price_date"]
          primary_key: [["index_code"], ["price_date"]]
      - stream:
          name: "trading_alert"
          json_schema: {}
          supported_sync_modes: ["full_refresh", "incremental"]
          default_cursor_field: ["ingested_at"]
        config:
          sync_mode: "incremental"
          destination_sync_mode: "append"
          cursor_field: ["ingested_at"]
      - stream:
          name: "customer_complaint"
          json_schema: {}
          supported_sync_modes: ["full_refresh", "incremental"]
          default_cursor_field: ["ingested_at"]
        config:
          sync_mode: "incremental"
          destination_sync_mode: "append"
          cursor_field: ["ingested_at"]
