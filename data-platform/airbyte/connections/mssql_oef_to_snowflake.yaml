# Octavia CLI connection config. Only dimension tables sync through Airbyte/JDBC here -
# oef_trade, account_balance_daily and position_daily load via the file-based bulk path instead
# (see snowflake/04_bulk_load_oef.sql).
definition_type: connection
resource_name: "mssql_oef_to_snowflake"
source_configuration_path: "sources/mssql_oef.yaml"
destination_configuration_path: "destinations/snowflake_raw.yaml"
configuration:
  schedule_type: manual
  destination_namespace: "OEF"  # lands in RAW.OEF
  namespace_definition: "custom_format"
  sync_catalog:
    streams:
      - stream:
          name: "fund"
          json_schema: {}
          supported_sync_modes: ["full_refresh"]
        config:
          sync_mode: "full_refresh"
          destination_sync_mode: "overwrite"
      - stream:
          name: "fund_nav_history"
          json_schema: {}
          supported_sync_modes: ["full_refresh", "incremental"]
          default_cursor_field: ["nav_date"]
        config:
          sync_mode: "incremental"
          destination_sync_mode: "append_dedup"
          cursor_field: ["nav_date"]
          primary_key: [["fund_id"], ["nav_date"]]
      - stream:
          name: "account"
          json_schema: {}
          supported_sync_modes: ["full_refresh"]
        config:
          sync_mode: "full_refresh"
          destination_sync_mode: "overwrite"
      # oef_trade / account_balance_daily / position_daily: deliberately NOT listed here - loaded
      # via Parquet export + Snowpipe/COPY INTO instead.
