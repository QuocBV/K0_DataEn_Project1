# Octavia CLI source config - built with Airbyte's low-code Connector Builder against hr-api/
# (FastAPI static/mock service). Swap base_url for the real HR system endpoint later - no schema
# change needed downstream since dbt staging models isolate the raw shape.
#
# hr-api/main.py enforces HR_API_AUTH_MODE (none/api_key/jwt) - this connector's auth block must
# match whatever hr-api is actually running with. Pick ONE of the two authenticator blocks below
# (in the real Connector Builder manifest this lives under streams[].retriever.requester.authenticator
# - shown here in the same abbreviated Octavia-style config as the rest of this file).
#
# Option A - static header (HR_API_AUTH_MODE=api_key), any arbitrary header key/value:
#   auth:
#     type: ApiKeyAuthenticator
#     header: "X-API-Key"           # change to whatever header name the real HR API expects
#     api_token: "${HR_API_KEY}"
#
# Option B - JWT Bearer token (HR_API_AUTH_MODE=jwt):
#   auth:
#     type: BearerAuthenticator
#     api_token: "${HR_API_JWT_TOKEN}"   # a pre-issued/short-lived JWT, not the signing secret -
#                                        # the signing secret (HR_API_JWT_SECRET) only lives on the
#                                        # hr-api server side to verify the token, never in Airbyte
definition_type: source
resource_name: "hr_api"
definition_id: custom-low-code-hr-api  # built via Connector Builder, published as a custom connector
configuration:
  base_url: "${HR_API_BASE_URL}"  # e.g. http://hr-api.internal:8000
  auth:
    type: ApiKeyAuthenticator
    header: "X-API-Key"
    api_token: "${HR_API_KEY}"
  streams:
    - name: "employees"
      path: "/employees"
      # id_number (CCCD), not employee_code: this stream covers both MG (nhan vien, co employee_code)
      # and CTV (cong tac vien, khong co employee_code) - id_number is the only key both always have.
      primary_key: "id_number"
      pagination: none
