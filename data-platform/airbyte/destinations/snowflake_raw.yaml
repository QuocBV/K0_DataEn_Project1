# Octavia CLI destination config - shared Snowflake destination used by all 5 source connections
# (Common, Equity/Derivatives/OEF dimension tables, HR API).
#
# "Moi loai du lieu 1 folder rieng" is implemented via SNOWFLAKE SCHEMA, not file-storage folders:
# loading_method is "Internal Staging" (Snowflake manages its own stage per table internally -
# there is no external bucket/file path to organize into folders here). Each connection instead
# overrides `schema` / `destination_namespace` to land in its own RAW.<SCHEMA> - see
# connections/*.yaml (destination_namespace: COMMON / EQUITY / DERIVATIVES / OEF / HR). That gives
# the same practical separation (each data type physically isolated, browsable, independently
# permissioned) without taking on a second cloud storage account just for Airbyte's own staging.
#
# The separate bulk-load path for heavy trade/snapshot tables (scripts/export_partition_to_parquet.py
# + snowflake/03_bulk_load_*.sql) is unrelated to this destination - it writes Parquet directly to
# an Azure Blob stage that Snowflake reads via Snowpipe/COPY INTO, organized in real per-table
# subfolders (<table>/dt=<date>/) since that path doesn't go through Airbyte at all.
definition_type: destination
resource_name: "snowflake_raw"
definition_id: 424892c4-daac-4491-b35d-c6688ba547ba  # Snowflake destination connector
configuration:
  host: "${SNOWFLAKE_ACCOUNT}.snowflakecomputing.com"
  role: "LOADER_ROLE"
  warehouse: "WH_INGEST"
  database: "RAW"
  schema: "COMMON"  # overridden per-connection via destination_namespace (COMMON / EQUITY / DERIVATIVES / OEF / HR)
  username: "${SNOWFLAKE_LOADER_USER}"
  credentials:
    auth_type: "username/password"
    password: "${SNOWFLAKE_LOADER_PASSWORD}"
  loading_method:
    method: "Internal Staging"
