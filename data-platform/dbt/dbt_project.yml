name: "ssi_trading_analytics"
version: "1.0.0"
config-version: 2

profile: "ssi_trading_analytics"

model-paths: ["models"]
macro-paths: ["macros"]
test-paths: ["tests"]
seed-paths: ["seeds"]
snapshot-paths: ["snapshots"]

target-path: "target"
clean-targets: ["target", "dbt_packages"]

models:
  ssi_trading_analytics:
    marts:
      +materialized: table
      +schema: gold
      dim:
        +tags: ["dimension"]
      fact:
        +tags: ["fact"]
      intermediate:
        +materialized: view
        +tags: ["intermediate"]
      reports:
        +materialized: view # reports are thin views over fact/dim - always reflect latest state
        +tags: ["report"]
