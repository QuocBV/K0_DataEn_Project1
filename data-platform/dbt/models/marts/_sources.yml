version: 2

sources:
  - name: raw_common
    database: ssi_raw
    schema: "SSI_Common"
    description: "Raw Parquet from SSI_Common (Airbyte -> s3://de-project-commission/raw/SSI_Common/)"
    tables:
      - name: branch
      - name: department
      - name: broker
      - name: customer
      - name: customer_broker_history
      - name: customer_risk_profile
      - name: customer_segment_history
      - name: customer_acquisition
      - name: fee_schedule
      - name: management_commission_schedule
      - name: market_index_price
      - name: trading_alert
      - name: customer_complaint
      - name: account
      - name: employees

  - name: raw_equity
    database: ssi_raw
    schema: "SSI_Equity"
    description: "Raw Parquet from SSI_Equity (Airbyte -> s3://de-project-commission/raw/SSI_Equity/)"
    tables:
      - name: security
      - name: daily_price
      - name: equity_trade
      - name: account_balance_daily
      - name: position_daily
      - name: margin_loan_daily

  - name: raw_derivatives
    database: ssi_raw
    schema: "SSI_Derivatives"
    description: "Raw Parquet from SSI_Derivatives (Airbyte -> s3://de-project-commission/raw/SSI_Derivatives/)"
    tables:
      - name: derivative_contract
      - name: daily_settlement_price
      - name: derivative_trade
      - name: account_balance_daily
      - name: position_daily
      - name: margin_loan_daily

  - name: raw_oef
    database: ssi_raw
    schema: "SSI_OEF"
    description: "Raw Parquet from SSI_OEF (Airbyte -> s3://de-project-commission/raw/SSI_OEF/)"
    tables:
      - name: fund
      - name: fund_nav_history
      - name: oef_trade
      - name: account_balance_daily
      - name: position_daily

  - name: bronze
    database: ssi_data
    schema: bronze
    description: "Bronze Iceberg tables (raw -> Iceberg, written by dbt transform)"
    tables:
      - name: branch
      - name: department
      - name: broker
      - name: customer
      - name: customer_broker_history
      - name: customer_risk_profile
      - name: customer_segment_history
      - name: customer_acquisition
      - name: fee_schedule
      - name: management_commission_schedule
      - name: market_index_price
      - name: trading_alert
      - name: customer_complaint
      - name: account
      - name: employees
      - name: security
      - name: daily_price
      - name: equity_trade
      - name: account_balance_daily
      - name: position_daily
      - name: margin_loan_daily
      - name: derivative_contract
      - name: daily_settlement_price
      - name: derivative_trade
      - name: fund
      - name: fund_nav_history
      - name: oef_trade

  - name: silver
    database: ssi_data
    schema: silver
    description: "Silver Iceberg tables (cleaned/deduplicated from bronze by dbt)"
    tables:
      - name: branch
      - name: department
      - name: broker
      - name: customer
      - name: customer_broker_history
      - name: customer_risk_profile
      - name: customer_segment_history
      - name: customer_acquisition
      - name: fee_schedule
      - name: management_commission_schedule
      - name: market_index_price
      - name: trading_alert
      - name: customer_complaint
      - name: security
      - name: daily_price
      - name: account
      - name: equity_trade
      - name: account_balance_daily
      - name: position_daily
      - name: margin_loan_daily
      - name: derivative_contract
      - name: daily_settlement_price
      - name: derivative_trade
      - name: fund
      - name: fund_nav_history
      - name: oef_trade
      - name: employees

  - name: reporting
    database: ssi_report
    schema: reporting
    description: "Reporting Mart Iceberg tables (computed by Spark Commission Engine)"
    tables:
      - name: rpt_broker_commission_revenue
      - name: rpt_department_branch_ranking
      - name: rpt_broker_performance
      - name: rpt_trading_activity_summary
      - name: rpt_aum_summary
      - name: rpt_customer_acquisition_funnel
      - name: rpt_customer_dormant
      - name: rpt_position_concentration_risk
      - name: rpt_margin_call_alert
      - name: rpt_oef_fund_flow
      - name: rpt_customer_investment_performance
      - name: rpt_customer_cross_sell
      - name: rpt_management_override_commission
