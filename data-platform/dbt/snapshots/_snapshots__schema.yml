version: 2

snapshots:
  - name: snap_customer_profile
    description: "Raw dbt snapshot output (dbt_valid_from/dbt_valid_to/dbt_scd_id) - see dim_customer_history for the renamed, analyst-friendly view of this same data."
    columns:
      - name: dbt_scd_id
        tests: [not_null, unique]
      - name: customer_code
        tests: [not_null]
