# SodaCL checks for Gold layer (marts)
# These run after dbt transform to ensure data quality before BI serving.

checks for dim_broker:
  - row_count > 0
  - duplicate_count(broker_code) = 0
  - missing_count(broker_code) = 0
  - freshness(ingested_at) < 1d

checks for dim_customer:
  - row_count > 0
  - duplicate_count(customer_code) = 0
  - missing_count(customer_code) = 0
  - missing_count(customer_type) = 0
  - freshness(ingested_at) < 1d

checks for dim_account:
  - row_count > 0
  - duplicate_count(account_id) = 0
  - missing_count(account_id) = 0
  - freshness(ingested_at) < 1d

checks for dim_security:
  - row_count > 0
  - duplicate_count(security_id) = 0
  - freshness(ingested_at) < 1d

checks for fact_equity_trade:
  - row_count > 0
  - missing_count(trade_id) = 0
  - missing_count(quantity) = 0
  - missing_count(amount) = 0
  - duplicate_count(trade_id) = 0
  - freshness(ingested_at) < 1d
  - anomaly_detection for row_count:
      looked_back_n_days: 7
      sensitivity: 0.7

checks for fact_derivative_trade:
  - row_count > 0
  - missing_count(trade_id) = 0
  - duplicate_count(trade_id) = 0
  - freshness(ingested_at) < 1d
  - anomaly_detection for row_count:
      looked_back_n_days: 7
      sensitivity: 0.7

checks for fact_oef_trade:
  - row_count > 0
  - missing_count(trade_id) = 0
  - duplicate_count(trade_id) = 0
  - freshness(ingested_at) < 1d
  - anomaly_detection for row_count:
      looked_back_n_days: 7
      sensitivity: 0.7

# Report checks (views)
checks for rpt_broker_commission_revenue:
  - row_count > 0
  - missing_count(broker_code) = 0
  - values in (total_commission) must not be < 0
  - freshness(ingested_at) < 2d

checks for rpt_aum_summary:
  - row_count > 0
  - missing_count(customer_code) = 0
  - values in (aum_amount) must not be < 0
  - freshness(ingested_at) < 2d

checks for rpt_margin_call_alert:
  - row_count > 0
  - missing_count(account_id) = 0
  - values in (margin_ratio) must not be < 0

