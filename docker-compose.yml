# Local dev/test orchestration for Lakehouse platform: hr-api, Airflow, Spark, Hive Metastore,
# Trino, dbt, and Soda.
#
# NOT included here:
# - SQL Server (Database/): gated behind the "sqlserver" profile below
# - Airbyte: use its own official installer (abctl local install)
# - Amazon S3: managed service, supply AWS_* env vars below
#
# All secrets are read from a local .env file (gitignored). Copy .env.example to .env and fill in
# real values before running.
services:
  hr-api:
    build:
      context: ./hr-api
      args:
        PIP_INDEX_URL: ${PIP_INDEX_URL:-}
    environment:
      HR_API_AUTH_MODE: ${HR_API_AUTH_MODE:-none}
      HR_API_KEY: ${HR_API_KEY:-}
      HR_API_JWT_SECRET: ${HR_API_JWT_SECRET:-}
    ports:
      - "8000:8000"
    restart: unless-stopped

  # ====== Airflow ======
  airflow-postgres:
    image: postgres:16.4
    environment:
      POSTGRES_USER: airflow
      POSTGRES_PASSWORD: ${AIRFLOW_DB_PASSWORD}
      POSTGRES_DB: airflow
    volumes:
      - airflow_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U airflow"]
      interval: 10s
      timeout: 5s
      retries: 5

  airflow-init:
    build:
      context: ./data-platform/airflow
      args:
        PIP_INDEX_URL: ${PIP_INDEX_URL:-}
    depends_on:
      airflow-postgres:
        condition: service_healthy
    environment: &airflow-common-env
      AIRFLOW__CORE__EXECUTOR: LocalExecutor
      AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://airflow:${AIRFLOW_DB_PASSWORD}@airflow-postgres/airflow
      AIRFLOW__CORE__LOAD_EXAMPLES: "false"
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY}
      AWS_REGION: ${AWS_REGION:-ap-southeast-1}
      TRINO_HOST: trino
      TRINO_PORT: "8080"
      TRINO_USER: ${TRINO_USER:-admin}
      TRINO_PASSWORD: ${TRINO_PASSWORD:-}
      OPS_ALERT_WEBHOOK_URL: ${OPS_ALERT_WEBHOOK_URL:-}
      HR_API_BASE_URL: http://hr-api:8000
    entrypoint: /bin/bash
    command: -c "airflow db migrate && airflow users create --username ${AIRFLOW_ADMIN_USER:-admin} --password ${AIRFLOW_ADMIN_PASSWORD} --firstname Admin --lastname User --role Admin --email admin@ssi.com.vn"

  airflow-webserver:
    build:
      context: ./data-platform/airflow
      args:
        PIP_INDEX_URL: ${PIP_INDEX_URL:-}
    depends_on:
      airflow-init:
        condition: service_completed_successfully
    environment: *airflow-common-env
    volumes:
      - ./data-platform/dbt:/opt/airflow/data-platform/dbt
      - ./data-platform/spark:/opt/airflow/data-platform/spark
      - ./data-platform/soda:/opt/airflow/data-platform/soda
    ports:
      - "8080:8080"
    command: webserver
    restart: unless-stopped

  airflow-scheduler:
    build:
      context: ./data-platform/airflow
      args:
        PIP_INDEX_URL: ${PIP_INDEX_URL:-}
    depends_on:
      airflow-init:
        condition: service_completed_successfully
    environment: *airflow-common-env
    volumes:
      - ./data-platform/dbt:/opt/airflow/data-platform/dbt
      - ./data-platform/spark:/opt/airflow/data-platform/spark
      - ./data-platform/soda:/opt/airflow/data-platform/soda
    command: scheduler
    restart: unless-stopped

  # ====== Hive Metastore (Iceberg catalog) ======
  hive-metastore:
    image: apache/hive:4.0.0
    hostname: hive-metastore
    environment:
      HMS_DATABASE_DRIVER: org.postgresql.Driver
      HMS_DATABASE_URL: jdbc:postgresql://hive-metastore-db:5432/metastore
      HMS_DATABASE_USER: hive
      HMS_DATABASE_PASSWORD: hive
      S3_ENDPOINT: ${AWS_S3_ENDPOINT:-s3.amazonaws.com}
      S3_ACCESS_KEY: ${AWS_ACCESS_KEY_ID}
      S3_SECRET_KEY: ${AWS_SECRET_ACCESS_KEY}
    depends_on:
      hive-metastore-db:
        condition: service_healthy
    ports:
      - "9083:9083"

  hive-metastore-db:
    image: postgres:16.4
    environment:
      POSTGRES_USER: hive
      POSTGRES_PASSWORD: hive
      POSTGRES_DB: metastore
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U hive"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ====== Trino (SQL query engine for Iceberg) ======
  trino:
    image: trinodb/trino:462
    hostname: trino
    depends_on:
      - hive-metastore
    ports:
      - "8081:8080"
    volumes:
      - ./data-platform/trino/catalog:/etc/trino/catalog:ro
    environment:
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY}
      AWS_S3_ENDPOINT: ${AWS_S3_ENDPOINT:-s3.amazonaws.com}
      AWS_REGION: ${AWS_REGION:-ap-southeast-1}

  # ====== Spark (ETL processing) ======
  spark-master:
    image: bitnami/spark:3.5.1
    hostname: spark-master
    environment:
      SPARK_MODE: master
      SPARK_RPC_AUTHENTICATION_ENABLED: "no"
      SPARK_RPC_ENCRYPTION_ENABLED: "no"
      SPARK_LOCAL_STORAGE_ENCRYPTION_ENABLED: "no"
      SPARK_SSL_ENABLED: "no"
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY}
      AWS_S3_ENDPOINT: ${AWS_S3_ENDPOINT:-s3.amazonaws.com}
      AWS_REGION: ${AWS_REGION:-ap-southeast-1}
    ports:
      - "7077:7077"
      - "8082:8080"

  spark-worker:
    image: bitnami/spark:3.5.1
    hostname: spark-worker
    depends_on:
      - spark-master
    environment:
      SPARK_MODE: worker
      SPARK_MASTER_URL: spark://spark-master:7077
      SPARK_WORKER_MEMORY: 8G
      SPARK_WORKER_CORES: 4
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY}
      AWS_S3_ENDPOINT: ${AWS_S3_ENDPOINT:-s3.amazonaws.com}
      AWS_REGION: ${AWS_REGION:-ap-southeast-1}

  # ====== dbt (ad-hoc runs) ======
  dbt:
    build:
      context: ./data-platform/dbt
    environment:
      TRINO_HOST: trino
      TRINO_PORT: "8080"
      TRINO_USER: ${TRINO_USER:-admin}
      TRINO_PASSWORD: ${TRINO_PASSWORD:-}
    volumes:
      - ./data-platform/dbt/profiles.yml:/root/.dbt/profiles.yml:ro
    profiles: ["tools"]

  # ====== Optional, local dev only ======
  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-CU14-ubuntu-22.04
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: ${MSSQL_SA_PASSWORD}
    ports:
      - "1433:1433"
    volumes:
      - mssql_data:/var/opt/mssql
    profiles: ["sqlserver"]

volumes:
  airflow_postgres_data:
  mssql_data:
