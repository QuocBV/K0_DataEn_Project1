# Local dev/test orchestration for Lakehouse platform (Dagster orchestration).
services:
  hr-api:
    build:
      context: ./hr-api
    environment:
      HR_API_AUTH_MODE: ${HR_API_AUTH_MODE:-none}
      HR_API_KEY: ${HR_API_KEY:-}
      HR_API_JWT_SECRET: ${HR_API_JWT_SECRET:-}
    ports:
      - "8005:8000"

  # ====== Dagster (thay Airflow) ======
  dagster-postgres:
    image: postgres:16.4
    environment:
      POSTGRES_USER: dagster
      POSTGRES_PASSWORD: ${DAGSTER_POSTGRES_PASSWORD}
      POSTGRES_DB: dagster
    volumes:
      - dagster_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U dagster"]
      interval: 10s
      timeout: 5s
      retries: 5

  dagster-code-location:
    build:
      context: ./data-platform/dagster
    environment: &dagster-env
      DAGSTER_POSTGRES_PASSWORD: ${DAGSTER_POSTGRES_PASSWORD}
      DAGSTER_HOME: /opt/dagster
      TRINO_HOST: trino
      TRINO_PORT: "8080"
      TRINO_USER: ${TRINO_USER:-admin}
      TRINO_PASSWORD: ${TRINO_PASSWORD:-}
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY}
      AWS_REGION: ${AWS_REGION:-ap-southeast-1}
      AIRBYTE_HOST: host.docker.internal
      AIRBYTE_PORT: "8001"
      CONN_MSSQL_COMMON: ${CONN_MSSQL_COMMON:-}
      CONN_MSSQL_EQUITY: ${CONN_MSSQL_EQUITY:-}
      CONN_MSSQL_DERIVATIVES: ${CONN_MSSQL_DERIVATIVES:-}
      CONN_MSSQL_OEF: ${CONN_MSSQL_OEF:-}
    volumes:
      - ./data-platform/dagster:/opt/dagster
      - ./data-platform/dbt:/opt/airflow/data-platform/dbt
      - ./data-platform/soda:/opt/airflow/data-platform/soda
      - ./data-platform/dbt/profiles.yml:/root/.dbt/profiles.yml:ro
    command: dagster-webserver -h 0.0.0.0 -p 3000
    ports:
      - "3000:3000"

  dagster-daemon:
    build:
      context: ./data-platform/dagster
    environment: *dagster-env
    volumes:
      - ./data-platform/dagster:/opt/dagster
      - ./data-platform/dbt:/opt/airflow/data-platform/dbt
      - ./data-platform/soda:/opt/airflow/data-platform/soda
      - ./data-platform/dbt/profiles.yml:/root/.dbt/profiles.yml:ro
    command: dagster-daemon run

  # ====== Hive Metastore ======
  hive-metastore:
    image: apache/hive:4.0.0
    depends_on:
      - hive-metastore-db
    environment:
      HMS_DATABASE_DRIVER: org.postgresql.Driver
      HMS_DATABASE_URL: jdbc:postgresql://hive-metastore-db:5432/metastore
      HMS_DATABASE_USER: hive
      HMS_DATABASE_PASSWORD: hive
      S3_ENDPOINT: ${AWS_S3_ENDPOINT:-s3.amazonaws.com}
      S3_ACCESS_KEY: ${AWS_ACCESS_KEY_ID}
      S3_SECRET_KEY: ${AWS_SECRET_ACCESS_KEY}
    ports:
      - "9083:9083"

  hive-metastore-db:
    image: postgres:16.4
    environment:
      POSTGRES_USER: hive
      POSTGRES_PASSWORD: hive
      POSTGRES_DB: metastore
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U hive"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ====== Trino (SQL engine) ======
  trino:
    image: trinodb/trino:462
    depends_on:
      - hive-metastore
    ports:
      - "8081:8080"
    volumes:
      - ./data-platform/trino/catalog:/etc/trino/catalog:ro
    environment:
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY}
      AWS_S3_ENDPOINT: ${AWS_S3_ENDPOINT:-s3.amazonaws.com}
      AWS_REGION: ${AWS_REGION:-ap-southeast-1}
      MSSQL_EXPORT_USER: ${MSSQL_EXPORT_USER}
      MSSQL_EXPORT_PASSWORD: ${MSSQL_EXPORT_PASSWORD}

  # ====== BI - Apache Superset (13 báo cáo qua Trino) ======
  superset:
    build: ./data-platform/superset
    environment:
      SUPERSET_SECRET_KEY: ${SUPERSET_SECRET_KEY:-change-me}
      TRINO_URI: trino://admin@trino:8080/ssi_report
    depends_on: [trino]
    ports: ["8088:8088"]
    volumes:
      - ./data-platform/superset/superset_config.py:/app/pythonpath/superset_config.py
      - ./data-platform/superset/superset-init.sh:/app/docker-init.sh
    command: /bin/bash -c "bash /app/docker-init.sh && superset run -h 0.0.0.0 -p 8088 --with-threads --reload --debugger"

  # ====== dbt ======
  dbt:
    build:
      context: ./data-platform/dbt
    environment:
      TRINO_HOST: trino
      TRINO_PORT: "8080"
      TRINO_USER: ${TRINO_USER:-admin}
      TRINO_PASSWORD: ${TRINO_PASSWORD:-}
    working_dir: /dbt
    volumes:
      - ./data-platform/dbt:/dbt
      - ./data-platform/dbt/profiles.yml:/root/.dbt/profiles.yml:ro
    profiles: ["tools"]

volumes:
  dagster_postgres_data:
