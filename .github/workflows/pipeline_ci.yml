# ──────────────────────────────────────────────
# SSI Trading Analytics – CI/CD Pipeline
# ──────────────────────────────────────────────
# Triggers:
#   - push (hoặc PR) vào nhánh main, develop
#   - thay đổi file trong data-platform/
#
# Stages:
#   1. validate: Kiểm tra YAML, schemas, syntax
#   2. docker_build: Build thử container airflow, meltano, dbt
#   3. dbt_docs: Generate dbt docs để review
#   4. soda_validate: Kiểm tra Soda checks syntax
#   5. deploy-dev: (khi có infra) Deploy lên dev stack
#
# Yêu cầu secrets (GitHub Secrets):
#   SNOWFLAKE_ACCOUNT, SNOWFLAKE_TRANSFORM_USER, SNOWFLAKE_TRANSFORM_PASSWORD
#   MSSQL_HOST, MSSQL_EXPORT_USER, MSSQL_EXPORT_PASSWORD
#   AWS_ACCESS_KEY_ID, AWS_SECRET_ACCESS_KEY, AWS_DEFAULT_REGION, S3_BUCKET
#   (các secret này dùng cho integration test, có thể mock nếu cần)

name: SSI Analytics Pipeline CI/CD

on:
  push:
    branches: [main, develop]
    paths:
      - "data-platform/**"
      - "docker-compose.yml"
      - "hr-api/**"
  pull_request:
    branches: [main]
    paths:
      - "data-platform/**"
      - "docker-compose.yml"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  DOCKER_BUILDKIT: 1
  COMPOSE_FILE: docker-compose.yml

jobs:
  # ── Stage 1: Validate ────────────────────────
  validate:
    name: Validate & Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install validation dependencies
        run: |
          pip install --upgrade pip
          pip install yamllint dbt-core==1.8.8

      - name: Validate YAML files
        run: python data-platform/scripts/ci_validate_yaml.py

      - name: Validate dbt project
        run: |
          cd data-platform/dbt
          dbt deps
          dbt compile --selector default --threads 1 || echo "dbt compile may fail without Snowflake - ignoring"

      - name: Validate DAG import (syntax only)
        run: |
          pip install pytest
          for f in data-platform/airflow/dags/*.py; do
            python -m py_compile "$f" && echo "  $f OK"
          done

  # ── Stage 2: Docker Build Test ───────────────
  docker_build:
    name: Docker Build
    needs: [validate]
    runs-on: ubuntu-latest
    strategy:
      matrix:
        service:
          - context: ./data-platform/airflow
            image: airflow
          - context: ./data-platform/meltano
            image: meltano
          - context: ./data-platform/dbt
            image: dbt
          - context: ./hr-api
            image: hr-api
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build ${{ matrix.service.image }}
        uses: docker/build-push-action@v5
        with:
          context: ${{ matrix.service.context }}
          push: false
          load: true
          tags: ssi-analytics/${{ matrix.service.image }}:test-${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ── Stage 3: dbt Docs Generate ───────────────
  dbt_docs:
    name: dbt Docs
    needs: [validate]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dbt
        run: |
          pip install dbt-core==1.8.8 dbt-snowflake==1.8.4

      - name: Generate dbt docs
        env:
          SNOWFLAKE_ACCOUNT: ${{ secrets.SNOWFLAKE_ACCOUNT || 'dummy' }}
          SNOWFLAKE_TRANSFORM_USER: ${{ secrets.SNOWFLAKE_TRANSFORM_USER || 'dummy' }}
          SNOWFLAKE_TRANSFORM_PASSWORD: ${{ secrets.SNOWFLAKE_TRANSFORM_PASSWORD || 'dummy' }}
        run: |
          cd data-platform/dbt
          dbt deps
          dbt docs generate --no-version-check || (
            echo "dbt docs generate may fail without Snowflake; attempting fallback..."
            if [ -f target/manifest.json ]; then
              dbt docs serve --no-browser --port 8080 &
              echo "Serving docs on port 8080 (for review)"
            fi
          )

      - name: Upload dbt docs as artifact
        uses: actions/upload-artifact@v4
        with:
          name: dbt-docs-${{ github.sha }}
          path: data-platform/dbt/target/
          retention-days: 7

  # ── Stage 4: Soda Check Validation ───────────
  soda_validate:
    name: Soda Checks Syntax
    needs: [validate]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Soda Core
        run: pip install soda-core==3.4.0

      - name: Validate Soda checks
        run: python data-platform/scripts/ci_validate_soda_checks.py

  # ── Stage 5: Deploy to Dev ───────────────────
  deploy-dev:
    name: Deploy Dev Stack
    needs: [docker_build, dbt_docs, soda_validate]
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/develop'
    steps:
      - uses: actions/checkout@v4
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.DEV_HOST }}
          username: ${{ secrets.DEV_USER }}
          key: ${{ secrets.DEV_SSH_KEY }}
          script: |
            cd /opt/ssi-analytics
            git pull
            docker compose -f docker-compose.yml up -d --build
            docker compose restart airflow-scheduler
      - name: Verify deployment
        run: |
          echo "Deployment completed. Check http://dev-ssi:8080 (Airflow), :8088 (Superset)"
